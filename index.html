<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MDS Rian - Absensi & Stock Mall</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{--bg:#080808;--card:#141414;--border:#222;--green:#00e676;--blue:#2196f3;--red:#ff5252}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system}
body{background:var(--bg);color:#fff;min-height:100vh;padding-bottom:90px}
.header{position:sticky;top:0;z-index:10;background:rgba(8,8,8,0.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;font-size:18px;letter-spacing:-0.5px} .logo span{color:var(--green)}
.badge{font-size:10px;background:var(--green);color:#000;padding:4px 8px;border-radius:20px;font-weight:800}
.tabs{display:flex;gap:8px;padding:12px 16px}
.tab{flex:1;padding:12px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:#888;font-weight:700;text-align:center}
.tab.active{background:#fff;color:#000;border-color:#fff}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;margin:12px 16px}
.btn{width:100%;padding:14px;border-radius:12px;border:none;font-weight:800;font-size:14px;cursor:pointer;margin-top:8px}
.btn-green{background:var(--green);color:#000} .btn-blue{background:var(--blue);color:#fff} .btn-dark{background:#1e1e1e;color:#888;border:1px solid var(--border)}
input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #2a2a2a;background:#0f0f0f;color:#fff;margin:6px 0;font-size:14px}
label{font-size:11px;color:#666;font-weight:700;margin-top:8px;display:block;letter-spacing:0.5px}
#reader{border-radius:12px;overflow:hidden;margin-top:8px}
.item{display:flex;justify-content:space-between;align-items:center;background:#0f0f0f;border:1px solid #1e1e1e;border-radius:12px;padding:12px;margin:8px 0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;margin-right:6px}
.small{font-size:11px;color:#666}
.camera-box{position:relative;width:100%;aspect-ratio:4/3;background:#000;border-radius:12px;overflow:hidden;margin-top:8px}
.camera-box video{width:100%;height:100%;object-fit:cover}
canvas{display:none}
</style>
</head>
<body>
<div class="header">
<div class="logo">MDS <span>RIAN</span></div>
<div class="badge">ONLINE • 300 USER READY</div>
</div>
<div class="tabs">
<div class="tab active" id="tabAbsen" onclick="switchTab('absen')">🕒 ABSENSI</div>
<div class="tab" id="tabStock" onclick="switchTab('stock')">📦 STOCK</div>
</div>
<div id="viewAbsen">
<div class="card">
<div class="small"><span class="dot"></span>LOKASI: SERANG (-6.117, 106.182) Radius 300m</div>
<div id="gpsStatus" class="small" style="margin-top:6px">Mengecek GPS...</div>
<div class="camera-box"><video id="video" autoplay playsinline></video><canvas id="canvas"></canvas></div>
<input id="namaKaryawan" placeholder="Nama: Rian" value="Rian">
<button class="btn btn-green" onclick="absen()">📸 ABSEN SEKARANG + FOTO</button>
<div id="absenLog" style="margin-top:12px"></div>
</div>
</div>
<div id="viewStock" style="display:none">
<div class="card">
<h4 style="font-size:14px">SCAN BARCODE STOCK</h4>
<div id="reader"></div>
<button class="btn btn-green" onclick="startScan()">📷 MULAI SCAN BARCODE</button>
<button class="btn btn-dark" id="stopBtn" style="display:none" onclick="stopScan()">STOP SCAN</button>
<label>BARCODE</label>
<input id="barcode" placeholder="Auto dari scan">
<label>NAMA BARANG</label>
<input id="namaBarang" placeholder="Contoh: AQUA 600ML">
<label>QTY FISIK</label>
<input id="qty" type="number" placeholder="0">
<button class="btn btn-green" onclick="simpanStock()">💾 SIMPAN STOCK</button>
</div>
<div class="card">
<div style="display:flex;justify-content:space-between"><h4>Rekap Hari Ini</h4><span id="stockCount" style="font-weight:800;color:var(--green)">0</span></div>
<button class="btn btn-blue" onclick="exportAll()">📥 DOWNLOAD EXCEL (ABSEN+STOCK) BUAT BOS</button>
<div id="stockList"></div>
<button class="btn btn-dark" onclick="clearAll()">Hapus Data Lokal</button>
</div>
</div>
<script>
const TARGET_LAT=-6.117088; const TARGET_LNG=106.182; const RADIUS_M=1000;
let absenData=JSON.parse(localStorage.getItem('mdsrian_absen')||'[]');
let stockData=JSON.parse(localStorage.getItem('mdsrian_stock')||'[]');
let html5Qr=null; let stream=null;
function switchTab(t){
 document.getElementById('tabAbsen').classList.toggle('active', t==='absen');
 document.getElementById('tabStock').classList.toggle('active', t==='stock');
 document.getElementById('viewAbsen').style.display = t==='absen'?'block':'none';
 document.getElementById('viewStock').style.display = t==='stock'?'block':'none';
 if(t==='absen') initCamera();
}
async function initCamera(){
 try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});
 document.getElementById('video').srcObject=stream; }catch(e){ document.getElementById('gpsStatus').innerText='Kamera perlu izin'; }
 checkGPS();
}
function checkGPS(){
 if(!navigator.geolocation){ document.getElementById('gpsStatus').innerText='GPS tidak support'; return; }
 navigator.geolocation.getCurrentPosition(pos=>{
  let d=distance(pos.coords.latitude,pos.coords.longitude,TARGET_LAT,TARGET_LNG);
  let ok=d<=RADIUS_M;
  document.getElementById('gpsStatus').innerHTML=(ok?'✅':'❌')+` Jarak ${Math.round(d)}m dari mall - ${ok?'Bisa absen':'Di luar area'}`;
  document.getElementById('gpsStatus').style.color=ok?'#00e676':'#ff5252';
 }, err=>{ document.getElementById('gpsStatus').innerText='Aktifkan GPS'; });
}
function distance(lat1,lon1,lat2,lon2){ let R=6371e3; let a1=lat1*Math.PI/180,a2=lat2*Math.PI/180; let d1=(lat2-lat1)*Math.PI/180,d2=(lon2-lon1)*Math.PI/180; let a=Math.sin(d1/2)**2+Math.cos(a1)*Math.cos(a2)*Math.sin(d2/2)**2; return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)); }
function absen(){
 let nama=document.getElementById('namaKaryawan').value||'Rian';
 let video=document.getElementById('video'); let canvas=document.getElementById('canvas');
 canvas.width=video.videoWidth; canvas.height=video.videoHeight;
 canvas.getContext('2d').drawImage(video,0,0);
 let foto=canvas.toDataURL('image/jpeg',0.6);
 let now=new Date();
 navigator.geolocation.getCurrentPosition(pos=>{
  let d=distance(pos.coords.latitude,pos.coords.longitude,TARGET_LAT,TARGET_LNG);
  if(d>RADIUS_M) return alert('❌ Di luar area mall Serang! Jarak '+Math.round(d)+'m');
  absenData.unshift({nama:nama,waktu:now.toLocaleString('id-ID'),lat:pos.coords.latitude,lng:pos.coords.longitude,foto:foto,jarak:Math.round(d)});
  localStorage.setItem('mdsrian_absen',JSON.stringify(absenData));
  renderAbsen(); alert('✅ Absen berhasil!');
 },()=>alert('Aktifkan GPS dulu'));
}
function renderAbsen(){
 document.getElementById('absenLog').innerHTML=absenData.slice(0,5).map(a=>`<div class=item><div><b>${a.nama}</b><br><span class=small>${a.waktu} • ${a.jarak}m</span></div><span style=color:var(--green)>✔</span></div>`).join('')||'<div class=small>Belum absen hari ini</div>';
}
function startScan(){
 html5Qr=new Html5Qrcode("reader");
 html5Qr.start({facingMode:"environment"},{fps:10,qrbox:250},dec=>{
  document.getElementById('barcode').value=dec;
  try{let c=new AudioContext();let o=c.createOscillator();o.connect(c.destination);o.frequency.value=800;o.start();setTimeout(()=>o.stop(),120)}catch(e){}
  stopScan(); document.getElementById('namaBarang').focus();
 },()=>{}).catch(e=>alert(e));
 document.getElementById('stopBtn').style.display='block';
}
function stopScan(){ if(html5Qr)html5Qr.stop(); document.getElementById('stopBtn').style.display='none'; }
function simpanStock(){
 let b=document.getElementById('barcode').value.trim();
 let n=document.getElementById('namaBarang').value.trim();
 let q=document.getElementById('qty').value;
 if(!b||!q) return alert('Barcode & Qty wajib!');
 let now=new Date();
 stockData.unshift({barcode:b,nama:n||b,qty:q,time:now.toLocaleString('id-ID')});
 localStorage.setItem('mdsrian_stock',JSON.stringify(stockData));
 document.getElementById('barcode').value=''; document.getElementById('namaBarang').value=''; document.getElementById('qty').value='';
 renderStock(); startScan();
}
function renderStock(){
 document.getElementById('stockCount').innerText=stockData.length;
 document.getElementById('stockList').innerHTML=stockData.map((s,i)=>`<div class=item><div><b>${s.barcode}</b><br><span class=small>${s.nama} • Qty:${s.qty}</span></div><div onclick="stockData.splice(${i},1);localStorage.setItem('mdsrian_stock',JSON.stringify(stockData));renderStock()" style=color:var(--red)>❌</div></div>`).join('')||'<div class=small style=text-align:center;padding:12px>Belum ada scan</div>';
}
function exportAll(){
 if(!absenData.length&&!stockData.length) return alert('Belum ada data');
 let csv='MDS RIAN - Laporan Gabungan\n\nABSENSI\nNama,Waktu,Jarak\n'+absenData.map(a=>`${a.nama},${a.waktu},${a.jarak}m`).join('\n')+'\n\nSTOCK OPNAME\nBarcode,Nama,Qty,Waktu\n'+stockData.map(s=>`${s.barcode},${s.nama},${s.qty},${s.time}`).join('\n');
 let blob=new Blob([csv],{type:'text/csv'}); let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='MDS-Rian-'+new Date().toLocaleDateString('id-ID')+'.csv'; a.click();
}
function clearAll(){ if(confirm('Hapus semua data lokal?')){ absenData=[]; stockData=[]; localStorage.removeItem('mdsrian_absen'); localStorage.removeItem('mdsrian_stock'); renderAbsen(); renderStock(); } }
renderAbsen(); renderStock(); initCamera();
</script>
</body>
</html>
