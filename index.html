<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>MDS RIAN - Absensi & Stock Mall</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00e676">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{--bg:#080808;--card:#121212;--accent:#00e676;--text:#fff;--muted:#888}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui, -apple-system, sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid #222}
header h1{font-size:18px} header h1 span{color:var(--accent)}
.badge{background:var(--accent);color:#000;font-size:10px;padding:6px 10px;border-radius:20px;font-weight:800}
.tabs{display:flex;gap:10px;padding:16px}
.tab{flex:1;padding:14px;border-radius:16px;border:1px solid #222;background:var(--card);color:var(--muted);font-weight:700;text-align:center;cursor:pointer}
.tab.active{background:#e0e0e0;color:#000}
.card{margin:0 16px 16px;background:var(--card);border-radius:20px;padding:16px;border:1px solid #1e1e1e}
.loc{font-size:12px;color:var(--muted)} 
.loc.ok{color:var(--accent);margin-top:6px;font-size:13px;font-weight:600}
video{width:100%;border-radius:16px;background:#000;aspect-ratio:4/3;object-fit:cover;margin:12px 0}
input{width:100%;background:#0f0f0f;border:1px solid #222;border-radius:12px;padding:14px;color:#fff;margin:8px 0;outline:none}
input:focus{border-color:var(--accent)}
button.main{width:100%;background:var(--accent);color:#000;border:none;border-radius:14px;padding:16px;font-weight:800;font-size:14px;margin-top:10px;cursor:pointer}
button:disabled{opacity:0.3;cursor:not-allowed}
.list-item{display:flex;gap:10px;background:#0f0f0f;padding:10px;border-radius:12px;margin-top:8px;font-size:13px;border:1px solid #1a1a1a}
</style>
</head>
<body>
<header><h1>MDS <span>RIAN</span></h1><div class="badge">ONLINE • 50M • 300 USER</div></header>
<div class="tabs">
  <div class="tab active" id="tAbsen" onclick="switchTab('absen')">🕒 ABSENSI</div>
  <div class="tab" id="tStok" onclick="switchTab('stok')">📦 STOK</div>
</div>

<div id="tab-absen" class="card">
  <div id="locText" class="loc">📍 LOKASI: SERANG (-6.117, 106.182) Radius 50m - Mencari...</div>
  <div id="locOk" class="loc ok"></div>
  <video id="cam" autoplay playsinline muted></video>
  <canvas id="canvas" style="display:none"></canvas>
  <input id="nama" placeholder="Nama Karyawan" value="Rian">
  <button id="btnAbsen" class="main" onclick="absen()">📸 ABSEN SEKARANG + FOTO</button>
  <div id="absenList" style="margin-top:12px"></div>
</div>

<div id="tab-stok" class="card" style="display:none">
  <h3 style="margin-bottom:8px">Scan Stock Opname</h3>
  <div id="reader" style="margin:10px 0"></div>
  <input id="itemName" placeholder="Nama Barang / Scan Barcode">
  <input id="itemQty" type="number" placeholder="Qty">
  <button class="main" onclick="tambahStok()">TAMBAH STOK</button>
  <div id="stokList" style="margin-top:12px"></div>
</div>

<script>
// === SETTING LOKASI SERANG - 50 METER ===
const MALL_LAT = -6.117;
const MALL_LNG = 106.182;
const MALL_RADIUS = 50; // INI YANG BIKIN 50M LUR, BUKAN 130M LAGI!

let userLat=0,userLng=0,inRange=false;

function haversine(lat1,lon1,lat2,lon2){
 const R=6371e3; const toRad=x=>x*Math.PI/180;
 const dLat=toRad(lat2-lat1); const dLon=toRad(lon2-lon1);
 const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
 return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function updateLocation(pos){
 userLat=pos.coords.latitude; userLng=pos.coords.longitude;
 const d=haversine(MALL_LAT,MALL_LNG,userLat,userLng);
 const locText=document.getElementById('locText');
 const locOk=document.getElementById('locOk');
 locText.textContent=`LOKASI: SERANG (${MALL_LAT}, ${MALL_LNG}) Radius ${MALL_RADIUS}m`;
 if(d<=MALL_RADIUS){
   inRange=true;
   locOk.textContent=`✅ Jarak ${Math.round(d)}m dari mall - Bisa absen`;
   document.getElementById('btnAbsen').disabled=false;
 }else{
   inRange=false;
   locOk.textContent=`❌ Jarak ${Math.round(d)}m dari mall - Terlalu jauh (Maks ${MALL_RADIUS}m)`;
   document.getElementById('btnAbsen').disabled=true;
 }
}
function locError(){
  document.getElementById('locText').textContent=`LOKASI: SERANG - Aktifkan GPS HP`;
}
if(navigator.geolocation){
  navigator.geolocation.watchPosition(updateLocation,locError,{enableHighAccuracy:true, maximumAge:0});
}

async function initCam(){
 try{
   const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}, audio:false});
   document.getElementById('cam').srcObject=s;
 }catch(e){console.log(e)}
}
initCam();

function absen(){
 if(!inRange){alert('Terlalu jauh! Kamu di luar '+MALL_RADIUS+'m dari mall!');return}
 const canvas=document.getElementById('canvas'); 
 const video=document.getElementById('cam');
 if(video.videoWidth==0){alert('Kamera belum siap');return}
 canvas.width=video.videoWidth; canvas.height=video.videoHeight;
 canvas.getContext('2d').drawImage(video,0,0);
 const foto=canvas.toDataURL('image/jpeg',0.6);
 const nama=document.getElementById('nama').value||'Rian';
 const data={nama,tgl:new Date().toLocaleString('id-ID'),lat:userLat,lng:userLng,foto, jarak: Math.round(haversine(MALL_LAT,MALL_LNG,userLat,userLng))};
 const list=JSON.parse(localStorage.getItem('absen')||'[]'); 
 list.unshift(data);
 localStorage.setItem('absen',JSON.stringify(list)); 
 renderAbsen();
 alert('✅ Absen Berhasil! Jarak '+data.jarak+'m');
}
function renderAbsen(){
 const list=JSON.parse(localStorage.getItem('absen')||'[]');
 document.getElementById('absenList').innerHTML=list.map(x=>`<div class="list-item"><img src="${x.foto}" style="width:52px;height:52px;border-radius:10px;object-fit:cover"><div><b>${x.nama}</b> - ${x.jarak}m<br><small>${x.tgl}</small></div></div>`).join('');
}
renderAbsen();

let scanner=null;
function switchTab(t){
 document.getElementById('tab-absen').style.display=t==='absen'?'block':'none';
 document.getElementById('tab-stok').style.display=t==='stok'?'block':'none';
 document.getElementById('tAbsen').classList.toggle('active',t==='absen');
 document.getElementById('tStok').classList.toggle('active',t==='stok');
 if(t==='stok' && !scanner){
   scanner=new Html5Qrcode('reader');
   scanner.start({facingMode:'environment'},{fps:10,qrbox:250},(txt)=>{document.getElementById('itemName').value=txt;}).catch(()=>{});
 }
}

function tambahStok(){
 const nama=document.getElementById('itemName').value; 
 const qty=document.getElementById('itemQty').value||1;
 if(!nama){alert('Isi nama barang');return}
 const list=JSON.parse(localStorage.getItem('stok')||'[]'); 
 list.unshift({nama,qty,tgl:new Date().toLocaleString('id-ID')});
 localStorage.setItem('stok',JSON.stringify(list)); 
 renderStok();
 document.getElementById('itemName').value='';
 document.getElementById('itemQty').value='';
}
function renderStok(){
 const list=JSON.parse(localStorage.getItem('stok')||'[]');
 document.getElementById('stokList').innerHTML=list.map(x=>`<div class="list-item"><div><b>${x.nama}</b> x ${x.qty}<br><small>${x.tgl}</small></div></div>`).join('');
}
renderStok();

// Bikin bisa di-INSTAL
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').then(()=>console.log('SW OK')).catch(()=>{});
}
</script>
</body>
</html>
